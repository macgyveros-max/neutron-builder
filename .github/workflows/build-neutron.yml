name: Build Neutron Browser (H.264) via Conda-Forge

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-neutron-h264:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Miniforge (Conda-Forge)
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          activate-environment: neutron_env
          channels: conda-forge
          channel-priority: strict
          conda-remove-defaults: true

      - name: Install Conda-Forge PyQt6 + WebEngine (H.264) + PyInstaller
        shell: pwsh
        run: |
          # ใช้ชื่อแพ็กเกจ pyqt6 และ pyqt6-webengine ของ Conda-Forge โดยตรง
          mamba install -y -c conda-forge python=3.12 pyqt6 pyqt6-sip pyqt6-webengine qt6-main qt6-webengine cryptography pyinstaller

          # ทดสอบโหลดโมดูลเพื่อยืนยันว่า DLL ทุกตัวทำงานร่วมกันได้ 100%
          python -c "import PyQt6.QtCore, PyQt6.QtWebEngineCore, PyQt6.QtWebEngineWidgets; print('SUCCESS! Qt Version:', PyQt6.QtCore.QT_VERSION_STR)"

      - name: Build Neutron EXE with PyInstaller
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # เรียกใช้ไฟล์ neutron_v1.6.1.py และ neutron.ico ที่มีอยู่ใน Git โดยตรง
          python -m PyInstaller --noconfirm --clean --onedir --icon=neutron.ico --windowed --name Neutron `
            --collect-all PyQt6 `
            --distpath dist --workpath build neutron_v1.6.1.py

          # คัดลอก QtWebEngineProcess.exe และ resources จาก Conda-Forge เข้าสู่โฟลเดอร์ _internal เพื่อให้ WebEngine ทำงานได้ครบถ้วน
          $libBin = "$env:CONDA_PREFIX\Library\bin"
          $libRes = "$env:CONDA_PREFIX\Library\resources"
          $libTrans = "$env:CONDA_PREFIX\Library\translations\qtwebengine_locales"
          $targetInternal = "dist\Neutron\_internal"

          if (Test-Path "$libBin\QtWebEngineProcess.exe") {
            Copy-Item "$libBin\QtWebEngineProcess.exe" -Destination "$targetInternal\" -Force
          }

          if (Test-Path $libRes) {
            New-Item -ItemType Directory -Force -Path "$targetInternal\resources" | Out-Null
            Copy-Item "$libRes\*" -Destination "$targetInternal\resources\" -Recurse -Force
          }

          if (Test-Path $libTrans) {
            New-Item -ItemType Directory -Force -Path "$targetInternal\translations\qtwebengine_locales" | Out-Null
            Copy-Item "$libTrans\*" -Destination "$targetInternal\translations\qtwebengine_locales\" -Recurse -Force
          }

          Write-Host "Build Neutron completed successfully!"

      - name: Upload Built Neutron Browser
        uses: actions/upload-artifact@v4
        with:
          name: Neutron-Browser-H264-Win64
          path: dist\Neutron\
          retention-days: 14
