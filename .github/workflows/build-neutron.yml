name: Build Neutron Browser

on:
  workflow_dispatch:

jobs:
  build-neutron-h264:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Miniforge (Conda-Forge)
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          activate-environment: neutron_env
          channels: conda-forge
          channel-priority: strict
          conda-remove-defaults: true

      - name: Install Pure Conda-Forge PyQt6 + WebEngine (H.264) + PyInstaller
        shell: pwsh
        run: |
          # ติดตั้งทุกแพ็กเกจจาก Conda-Forge ล้วน 100% เพื่อให้ DLL ทุกตัวเข้ากันได้สมบูรณ์
          mamba install -y -c conda-forge python=3.12 pyqt pyqt6-webengine qt6-main qt6-webengine cryptography pyinstaller

          # ทดสอบโหลดโมดูลเพื่อยืนยันว่าไม่มีปัญหา DLL load failed
          python -c "import PyQt6.QtCore, PyQt6.QtWebEngineCore, PyQt6.QtWebEngineWidgets; print('SUCCESS! Qt Version:', PyQt6.QtCore.QT_VERSION_STR)"

      - name: Build Neutron EXE with PyInstaller
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # ค้นหาไฟล์โค้ด Python ใน Repo (รองรับทั้งชื่อ neutron_v1.6.1.py และ neutron_v1.6.1.py.txt)
          $scriptFile = Get-ChildItem -Path . -Filter "neutron_v1.6.1*" | Select-Object -First 1
          if (-not $scriptFile) {
            throw "ไม่พบไฟล์ neutron_v1.6.1.py ใน Repository!"
          }
          Write-Host "Building from script: $($scriptFile.Name)"

          $iconArg = @()
          if (Test-Path "neutron.ico") {
            $iconArg = @("--icon=neutron.ico")
          }

          # สั่ง PyInstaller แพ็กเกจโปรแกรมพร้อมกวาดไฟล์ WebEngine ทั้งหมด
          python -m PyInstaller --noconfirm --clean --onedir @iconArg --windowed --name Neutron `
            --collect-all PyQt6 `
            --collect-all PyQt6_WebEngine `
            --distpath dist --workpath build "$($scriptFile.FullName)"

          # ตรวจสอบและคัดลอก QtWebEngineProcess.exe + resources จาก Conda-Forge เผื่อ PyInstaller ตกหล่น
          $libBin = "$env:CONDA_PREFIX\Library\bin"
          $libRes = "$env:CONDA_PREFIX\Library\resources"
          $libTrans = "$env:CONDA_PREFIX\Library\translations\qtwebengine_locales"
          $targetInternal = "dist\Neutron\_internal"

          # คัดลอก DLL เสริมและ QtWebEngineProcess.exe ไปไว้ใน _internal
          Copy-Item "$libBin\QtWebEngineProcess.exe" -Destination "$targetInternal\" -Force -ErrorAction SilentlyContinue
          if (Test-Path "$targetInternal\PyQt6\Qt6\bin") {
            Copy-Item "$libBin\QtWebEngineProcess.exe" -Destination "$targetInternal\PyQt6\Qt6\bin\" -Force -ErrorAction SilentlyContinue
          }

          if (Test-Path $libRes) {
            New-Item -ItemType Directory -Force -Path "$targetInternal\resources" | Out-Null
            Copy-Item "$libRes\*" -Destination "$targetInternal\resources\" -Recurse -Force -ErrorAction SilentlyContinue
            if (Test-Path "$targetInternal\PyQt6\Qt6\resources") {
              Copy-Item "$libRes\*" -Destination "$targetInternal\PyQt6\Qt6\resources\" -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

          if (Test-Path $libTrans) {
            New-Item -ItemType Directory -Force -Path "$targetInternal\translations\qtwebengine_locales" | Out-Null
            Copy-Item "$libTrans\*" -Destination "$targetInternal\translations\qtwebengine_locales\" -Recurse -Force -ErrorAction SilentlyContinue
          }

          # สร้างไฟล์ qt.conf เพื่อบอกให้ QtWebEngine รู้ตำแหน่งของ QtWebEngineProcess.exe และ resources
          "[Paths]`r`nPrefix = .`r`nBinaries = .`r`nData = .`r`nTranslations = translations" | Out-File -Encoding ascii "dist\Neutron\qt.conf"
          "[Paths]`r`nPrefix = .`r`nBinaries = .`r`nData = .`r`nTranslations = translations" | Out-File -Encoding ascii "$targetInternal\qt.conf"

          Write-Host "Build completed successfully!"

      - name: Upload Built Neutron Browser
        uses: actions/upload-artifact@v4
        with:
          name: Neutron-Browser-H264-Win64
          path: dist\Neutron\
          retention-days: 14
