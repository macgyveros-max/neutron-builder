name: Build Neutron Browser

on:
  workflow_dispatch:

jobs:
  build-neutron-h264:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Miniforge (Conda-Forge)
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          activate-environment: neutron_env
          channels: conda-forge
          channel-priority: strict
          conda-remove-defaults: true

      - name: Install Conda-Forge Qt6 + WebEngine (H.264) + PyQt6
        shell: pwsh
        run: |
          # 1. ติดตั้ง qt6-main, qt6-webengine (ที่เปิด H.264 มาแล้ว) และ pyqt (PyQt6) จาก Conda-Forge
          mamba install -y -c conda-forge python=3.12 qt6-main qt6-webengine pyqt pyqt-builder sip cryptography pyinstaller

      - name: Setup MSVC & Build PyQt6-WebEngine Bindings against Conda-Forge Qt6
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile Thin Python Bindings for PyQt6-WebEngine
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # คอมไพล์เฉพาะตัวเชื่อม Python (.pyd ขนาดเล็ก ใช้เวลา ~1-2 นาที) ให้ตรงกับ Qt6WebEngineCore.dll ของ Conda-Forge เป๊ะๆ
          $env:PATH = "$env:CONDA_PREFIX\Library\lib\qt6\bin;$env:CONDA_PREFIX\Library\bin;$env:PATH"
          
          pip install --no-deps --no-build-isolation --no-binary :all: PyQt6-WebEngine

          # ทดสอบโหลดโมดูลเพื่อยืนยันว่าใช้งานร่วมกันได้ 100%
          python -c "import PyQt6.QtCore, PyQt6.QtWebEngineCore, PyQt6.QtWebEngineWidgets; print('ALL LOADED SUCCESSFULLY! Qt Version:', PyQt6.QtCore.QT_VERSION_STR)"

      - name: Package Neutron EXE with PyInstaller
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:PATH = "$env:CONDA_PREFIX\Library\lib\qt6\bin;$env:CONDA_PREFIX\Library\bin;$env:PATH"

          $scriptFile = Get-ChildItem -Path . -Filter "neutron_v1.6.1*" | Select-Object -First 1
          if (-not $scriptFile) {
            throw "ไม่พบไฟล์ neutron_v1.6.1.py ใน Repository!"
          }

          # ถ้าไฟล์ลงท้ายด้วย .py.txt ให้ก๊อปปี้เป็น .py ก่อนเพื่อให้ PyInstaller ทำงานได้ถูกต้อง
          Copy-Item $scriptFile.FullName -Destination "neutron_main.py" -Force

          $iconArg = @()
          if (Test-Path "neutron.ico") {
            $iconArg = @("--icon=neutron.ico")
          }

          python -m PyInstaller --noconfirm --clean --onedir @iconArg --windowed --name Neutron `
            --paths "$env:CONDA_PREFIX\Library\lib\qt6\bin" `
            --paths "$env:CONDA_PREFIX\Library\bin" `
            --collect-all PyQt6 `
            --distpath dist --workpath build neutron_main.py

          $libRoot = "$env:CONDA_PREFIX\Library"
          $targetInternal = "dist\Neutron\_internal"

          # คัดลอก Qt6WebEngineCore.dll, QtWebEngineProcess.exe และ DLL พื้นฐานทั้งหมดของ Conda-Forge เข้า _internal
          Copy-Item "$libRoot\bin\*.dll" -Destination "$targetInternal\" -Force -ErrorAction SilentlyContinue
          if (Test-Path "$libRoot\lib\qt6\bin") {
            Copy-Item "$libRoot\lib\qt6\bin\*.dll" -Destination "$targetInternal\" -Force -ErrorAction SilentlyContinue
          }

          Get-ChildItem -Path $libRoot -Filter "QtWebEngineProcess.exe" -Recurse | ForEach-Object {
            Copy-Item $_.FullName -Destination "$targetInternal\" -Force
            Copy-Item $_.FullName -Destination "dist\Neutron\" -Force
          }

          # คัดลอก Qt Plugins (platforms/qwindows.dll ฯลฯ เพื่อให้เปิดหน้าต่าง GUI ขึ้น)
          Get-ChildItem -Path $libRoot -Directory -Filter "plugins" -Recurse | ForEach-Object {
            Copy-Item "$($_.FullName)\*" -Destination "$targetInternal\PyQt6\Qt6\plugins\" -Recurse -Force -ErrorAction SilentlyContinue
            Copy-Item "$($_.FullName)\*" -Destination "$targetInternal\plugins\" -Recurse -Force -ErrorAction SilentlyContinue
          }

          # คัดลอก Resources (.pak และ icudtl.dat)
          New-Item -ItemType Directory -Force -Path "$targetInternal\resources" | Out-Null
          Get-ChildItem -Path $libRoot -Include "qtwebengine*.pak", "icudtl.dat", "v8_context_snapshot*.bin" -Recurse | ForEach-Object {
            Copy-Item $_.FullName -Destination "$targetInternal\resources\" -Force
            Copy-Item $_.FullName -Destination "$targetInternal\" -Force
          }

          # คัดลอก Locales
          New-Item -ItemType Directory -Force -Path "$targetInternal\translations\qtwebengine_locales" | Out-Null
          Get-ChildItem -Path $libRoot -Directory -Filter "qtwebengine_locales" -Recurse | ForEach-Object {
            Copy-Item "$($_.FullName)\*" -Destination "$targetInternal\translations\qtwebengine_locales\" -Force -ErrorAction SilentlyContinue
          }

          Write-Host "Neutron H.264 Build Completed!"

      - name: Upload Built Neutron Browser
        uses: actions/upload-artifact@v4
        with:
          name: Neutron-Browser-H264-Win64
          path: dist\Neutron\
          retention-days: 14
