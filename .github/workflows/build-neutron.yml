name: Build Neutron Browser

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-neutron-h264:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Miniforge (Conda-Forge)
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          activate-environment: neutron_env
          channels: conda-forge
          channel-priority: strict
          conda-remove-defaults: true

      - name: Install Conda-Forge PyQt6 + WebEngine (H.264) + PyInstaller
        shell: pwsh
        run: |
          mamba install -y -c conda-forge python=3.12 pyqt6 pyqt6-sip pyqt6-webengine qt6-main qt6-webengine cryptography pyinstaller
          python -c "import PyQt6.QtCore, PyQt6.QtWebEngineCore, PyQt6.QtWebEngineWidgets; print('SUCCESS! Qt Version:', PyQt6.QtCore.QT_VERSION_STR)"

      - name: Build Neutron EXE with PyInstaller
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # ค้นหาตำแหน่งไฟล์ neutron_v1.6.1.py และ neutron.ico อัตโนมัติ (ไม่ว่าจะวางอยู่หน้าแรก หรือวางคู่กับ .yml ใน .github/workflows)
          $pyFile = Get-ChildItem -Path . -Filter "neutron_v1.6.1*.py*" -Recurse | Select-Object -First 1
          $icoFile = Get-ChildItem -Path . -Filter "neutron.ico" -Recurse | Select-Object -First 1

          if (-not $pyFile) {
            throw "ไม่พบไฟล์ neutron_v1.6.1.py ในโปรเจกต์!"
          }

          Write-Host "Found Python Script at: $($pyFile.FullName)"

          if ($icoFile) {
            Write-Host "Found Icon at: $($icoFile.FullName)"
            python -m PyInstaller --noconfirm --clean --onedir --icon="$($icoFile.FullName)" --windowed --name Neutron --collect-all PyQt6 --distpath dist --workpath build "$($pyFile.FullName)"
          } else {
            python -m PyInstaller --noconfirm --clean --onedir --windowed --name Neutron --collect-all PyQt6 --distpath dist --workpath build "$($pyFile.FullName)"
          }

          # คัดลอก QtWebEngineProcess.exe, resources และ locales จาก Conda-Forge เข้าสู่ _internal
          $libRoot = "$env:CONDA_PREFIX\Library"
          $targetInternal = "dist\Neutron\_internal"

          Get-ChildItem -Path $libRoot -Filter "QtWebEngineProcess.exe" -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName -Destination "$targetInternal\" -Force
          }

          Get-ChildItem -Path $libRoot -Include "qtwebengine*.pak", "icudtl.dat", "v8_context_snapshot*.bin" -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
            New-Item -ItemType Directory -Force -Path "$targetInternal\resources" | Out-Null
            Copy-Item $_.FullName -Destination "$targetInternal\resources\" -Force
            Copy-Item $_.FullName -Destination "$targetInternal\" -Force
          }

          Get-ChildItem -Path $libRoot -Directory -Filter "qtwebengine_locales" -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
            New-Item -ItemType Directory -Force -Path "$targetInternal\translations\qtwebengine_locales" | Out-Null
            Copy-Item "$($_.FullName)\*" -Destination "$targetInternal\translations\qtwebengine_locales\" -Force
          }

          Write-Host "Build Neutron completed successfully!"

      - name: Upload Built Neutron Browser
        uses: actions/upload-artifact@v4
        with:
          name: Neutron-Browser-H264-Win64
          path: dist\Neutron\
          retention-days: 14
