name: Build Qt6WebEngineCore (H.264) via Conda-Forge

on:
  workflow_dispatch:
    inputs:
      target_version:
        description: 'ระบุเวอร์ชัน Qt6 (เช่น 6.12.*, 6.11.* หรือ * เพื่อเอาตัวล่าสุด)'
        required: true
        default: '*'

jobs:
  build-h264-dll:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Miniforge (Conda-Forge)
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          activate-environment: qt6_h264
          channels: conda-forge
          channel-priority: strict
          conda-remove-defaults: true

      - name: Install Qt6 WebEngine with Proprietary Codecs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          Write-Host "Searching available qt6-webengine versions on conda-forge..."
          mamba search qt6-webengine -c conda-forge

          Write-Host "Attempting to install version: ${{ inputs.target_version }}"
          mamba install -y -c conda-forge "qt6-main=${{ inputs.target_version }}" "qt6-webengine=${{ inputs.target_version }}"
          
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Version ${{ inputs.target_version }} not available yet on conda-forge. Installing latest available qt6-webengine..."
            mamba install -y -c conda-forge qt6-main qt6-webengine
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to install qt6-webengine from conda-forge"
            }
          }

      - name: Locate and Package Qt6WebEngineCore.dll
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $outDir = "${{ github.workspace }}\Qt6WebEngine_H264_Pack"
          New-Item -ItemType Directory -Force -Path "$outDir\bin" | Out-Null
          New-Item -ItemType Directory -Force -Path "$outDir\resources" | Out-Null
          New-Item -ItemType Directory -Force -Path "$outDir\translations\qtwebengine_locales" | Out-Null

          $libRoot = "$env:CONDA_PREFIX\Library"
          Write-Host "Searching for Qt6WebEngineCore.dll inside $libRoot ..."

          # ค้นหาตำแหน่งจริงของ Qt6WebEngineCore.dll (รองรับทั้ง Library\lib\qt6\bin และ Library\bin)
          $coreDll = Get-ChildItem -Path $libRoot -Filter "Qt6WebEngineCore.dll" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $coreDll) {
            throw "Could not find Qt6WebEngineCore.dll in $libRoot"
          }

          $qtBinDir = $coreDll.DirectoryName
          Write-Host "Found Qt6 binaries at: $qtBinDir"

          # 1. คัดลอก Qt6WebEngine DLLs และ Qt6 Core DLLs จากโฟลเดอร์ qt6\bin
          Copy-Item "$qtBinDir\Qt6*.dll" -Destination "$outDir\bin\" -Force

          # 2. ค้นหาและคัดลอก QtWebEngineProcess.exe
          Get-ChildItem -Path $libRoot -Filter "QtWebEngineProcess.exe" -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName -Destination "$outDir\bin\" -Force
          }

          # 3. คัดลอก FFmpeg / ICU / Dependency DLLs จาก Library\bin (จำเป็นสำหรับถอดรหัส H.264)
          $mainBin = "$libRoot\bin"
          if (Test-Path $mainBin) {
            Copy-Item "$mainBin\av*.dll" -Destination "$outDir\bin\" -ErrorAction SilentlyContinue
            Copy-Item "$mainBin\sw*.dll" -Destination "$outDir\bin\" -ErrorAction SilentlyContinue
            Copy-Item "$mainBin\icu*.dll" -Destination "$outDir\bin\" -ErrorAction SilentlyContinue
            Copy-Item "$mainBin\lib*.dll" -Destination "$outDir\bin\" -ErrorAction SilentlyContinue
          }

          # 4. ค้นหาและคัดลอกไฟล์ Resources (.pak และ icudtl.dat)
          Get-ChildItem -Path $libRoot -Include "qtwebengine*.pak", "icudtl.dat", "v8_context_snapshot*.bin" -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName -Destination "$outDir\resources\" -Force
          }

          # 5. ค้นหาและคัดลอกไฟล์ Locales (.pak)
          Get-ChildItem -Path $libRoot -Directory -Filter "qtwebengine_locales" -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item "$($_.FullName)\*" -Destination "$outDir\translations\qtwebengine_locales\" -Force -ErrorAction SilentlyContinue
          }

          $ver = (Get-Item "$outDir\bin\Qt6WebEngineCore.dll").VersionInfo.FileVersion
          Write-Host "Successfully packaged Qt6WebEngineCore.dll version: $ver"
          
          "Qt6WebEngineCore.dll Version: $ver`r`nSource Path: $qtBinDir" | Out-File "$outDir\README_VERSION.txt"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Qt6WebEngineCore-H264-Package
          path: ${{ github.workspace }}\Qt6WebEngine_H264_Pack\
          retention-days: 14
