name: Build Qt6WebEngineCore (H.264) via Conda-Forge

on:
  workflow_dispatch:
    inputs:
      target_version:
        description: 'ระบุเวอร์ชัน Qt6 (เช่น 6.12.* หรือปล่อย * เพื่อใช้ตัวล่าสุดใน Conda-Forge)'
        required: true
        default: '*'

jobs:
  build-h264-dll:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Miniforge (Conda-Forge)
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          activate-environment: qt6_h264
          channels: conda-forge
          channel-priority: strict

      - name: Install Qt6 WebEngine with Proprietary Codecs
        shell: pwsh
        run: |
          mamba install -y -c conda-forge "python=3.12" "qt6-main=${{ inputs.target_version }}" "qt6-webengine=${{ inputs.target_version }}" "pyqt6=${{ inputs.target_version }}" "pyqt6-webengine=${{ inputs.target_version }}"
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "ไม่พบเวอร์ชัน ${{ inputs.target_version }} บน Conda-Forge กำลังติดตั้งเวอร์ชัน 6.x ล่าสุดแทน..."
            mamba install -y -c conda-forge "python=3.12" qt6-main qt6-webengine pyqt6 pyqt6-webengine
          }

      - name: Package Qt6WebEngineCore.dll and Dependencies
        shell: pwsh
        run: |
          $outDir = "${{ github.workspace }}\Qt6WebEngine_H264_Pack"
          New-Item -ItemType Directory -Force -Path "$outDir\bin" | Out-Null
          New-Item -ItemType Directory -Force -Path "$outDir\resources" | Out-Null
          New-Item -ItemType Directory -Force -Path "$outDir\translations" | Out-Null

          $condaBin = "$env:CONDA_PREFIX\Library\bin"
          $condaRes = "$env:CONDA_PREFIX\Library\resources"
          $condaTrans = "$env:CONDA_PREFIX\Library\translations"

          Copy-Item "$condaBin\Qt6WebEngine*.dll" -Destination "$outDir\bin\" -Force
          Copy-Item "$condaBin\QtWebEngineProcess.exe" -Destination "$outDir\bin\" -Force
          Copy-Item "$condaBin\av*.dll" -Destination "$outDir\bin\" -ErrorAction SilentlyContinue
          Copy-Item "$condaBin\sw*.dll" -Destination "$outDir\bin\" -ErrorAction SilentlyContinue
          Copy-Item "$condaBin\icu*.dll" -Destination "$outDir\bin\" -ErrorAction SilentlyContinue

          Copy-Item "$condaRes\*" -Destination "$outDir\resources\" -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item "$condaTrans\qtwebengine_locales" -Destination "$outDir\translations\" -Recurse -Force -ErrorAction SilentlyContinue

          $ver = (Get-Item "$outDir\bin\Qt6WebEngineCore.dll").VersionInfo.FileVersion
          Write-Host "Extracted Qt6WebEngineCore.dll version: $ver"
          "Qt6WebEngineCore.dll Version: $ver" | Out-File "$outDir\README_VERSION.txt"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Qt6WebEngineCore-H264-Package
          path: ${{ github.workspace }}\Qt6WebEngine_H264_Pack\
          retention-days: 14
