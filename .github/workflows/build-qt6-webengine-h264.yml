name: Build Qt6WebEngineCore (H.264) via Conda-Forge

on:
  workflow_dispatch:
    inputs:
      target_version:
        description: 'ระบุเวอร์ชัน Qt6 (เช่น 6.12.*, 6.11.* หรือปล่อย * เพื่อเอาตัวล่าสุด)'
        required: true
        default: '*'

jobs:
  build-h264-dll:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Miniforge (Conda-Forge)
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          activate-environment: qt6_h264
          channels: conda-forge
          channel-priority: strict

      - name: Search and Install qt6-webengine (C++ DLLs with H.264)
        shell: cmd /C "{0}"
        run: |
          echo === Checking available qt6-webengine versions on Conda-Forge ===
          call mamba search qt6-webengine -c conda-forge
          echo === Installing qt6-main and qt6-webengine ===
          call mamba install -y -c conda-forge "qt6-main=${{ inputs.target_version }}" "qt6-webengine=${{ inputs.target_version }}" || call mamba install -y -c conda-forge qt6-main qt6-webengine

      - name: Package Qt6WebEngineCore.dll and Dependencies
        shell: pwsh
        run: |
          $outDir = "${{ github.workspace }}\Qt6WebEngine_H264_Pack"
          New-Item -ItemType Directory -Force -Path "$outDir\bin" | Out-Null
          New-Item -ItemType Directory -Force -Path "$outDir\resources" | Out-Null
          New-Item -ItemType Directory -Force -Path "$outDir\translations" | Out-Null

          $condaBin = "$env:CONDA_PREFIX\Library\bin"
          $condaRes = "$env:CONDA_PREFIX\Library\resources"
          $condaTrans = "$env:CONDA_PREFIX\Library\translations"

          # คัดลอก Qt6WebEngineCore.dll และ Qt6 Core DLLs ทั้งชุดเพื่อให้ไม่มีปัญหา DLL ขัดแย้งกัน
          Copy-Item "$condaBin\Qt6*.dll" -Destination "$outDir\bin\" -Force
          Copy-Item "$condaBin\QtWebEngineProcess.exe" -Destination "$outDir\bin\" -Force

          # คัดลอก FFmpeg / ICU / Codec dependencies ที่ Qt6WebEngineCore.dll เรียกใช้
          Copy-Item "$condaBin\av*.dll" -Destination "$outDir\bin\" -ErrorAction SilentlyContinue
          Copy-Item "$condaBin\sw*.dll" -Destination "$outDir\bin\" -ErrorAction SilentlyContinue
          Copy-Item "$condaBin\icu*.dll" -Destination "$outDir\bin\" -ErrorAction SilentlyContinue
          Copy-Item "$condaBin\lib*.dll" -Destination "$outDir\bin\" -ErrorAction SilentlyContinue
          Copy-Item "$condaBin\zlib*.dll" -Destination "$outDir\bin\" -ErrorAction SilentlyContinue
          Copy-Item "$condaBin\zstd*.dll" -Destination "$outDir\bin\" -ErrorAction SilentlyContinue
          Copy-Item "$condaBin\jpeg*.dll" -Destination "$outDir\bin\" -ErrorAction SilentlyContinue

          # คัดลอก Resources และ Translations
          Copy-Item "$condaRes\*" -Destination "$outDir\resources\" -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item "$condaTrans\qtwebengine_locales" -Destination "$outDir\translations\" -Recurse -Force -ErrorAction SilentlyContinue

          $dllPath = "$outDir\bin\Qt6WebEngineCore.dll"
          if (Test-Path $dllPath) {
            $ver = (Get-Item $dllPath).VersionInfo.FileVersion
            Write-Host "Successfully packaged Qt6WebEngineCore.dll version: $ver"
            "Qt6WebEngineCore.dll Version: $ver" | Out-File "$outDir\README_VERSION.txt"
          } else {
            Write-Error "Qt6WebEngineCore.dll not found in $condaBin!"
            exit 1
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Qt6WebEngineCore-H264-Package
          path: ${{ github.workspace }}\Qt6WebEngine_H264_Pack\
          retention-days: 14
